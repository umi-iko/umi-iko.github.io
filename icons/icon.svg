<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"><defs>
    <!-- 波(1024x1024 座標系。海面 y≈770、リップ右上) -->
    <g id="wave">
      <!-- 海の本体(左は斜面、右は頂上からストンと落ちて海面へ) -->
      <path fill="#1F4E8C" d="M -20 790 C 90 780, 180 760, 250 700 C 330 632, 380 520, 450 440 C 530 350, 640 320, 740 335 C 850 352, 920 420, 940 520 C 958 610, 985 690, 1044 720 L 1044 1044 L -20 1044 Z"/>
      <!-- 頂上の泡のふくらみ -->
      <g fill="#1F4E8C">
        <circle cx="470" cy="450" r="30"/><circle cx="540" cy="392" r="34"/><circle cx="620" cy="350" r="36"/>
        <circle cx="710" cy="328" r="38"/><circle cx="800" cy="342" r="34"/><circle cx="880" cy="392" r="30"/>
        <circle cx="300" cy="660" r="26"/><circle cx="200" cy="742" r="22"/>
      </g>
      <!-- チューブ(空洞) -->
      <circle cx="760" cy="590" r="150" fill="#F5EEDF"/>
      <!-- リップの巻き(太→細のストローク) -->
      <g fill="none" stroke="#1F4E8C" stroke-linecap="round">
        <path stroke-width="82" d="M 640 372 C 760 330, 880 380, 900 490"/>
        <path stroke-width="62" d="M 900 490 C 918 580, 860 640, 790 630"/>
        <path stroke-width="42" d="M 790 630 C 735 622, 720 565, 762 540"/>
        <path stroke-width="26" d="M 762 540 C 790 525, 812 545, 800 570"/>
      </g>
      <!-- 泡(クリーム) -->
      <g fill="#F5EEDF">
        <circle cx="560" cy="440" r="16"/><circle cx="500" cy="500" r="13"/><circle cx="440" cy="590" r="12"/>
        <circle cx="660" cy="400" r="12"/><circle cx="360" cy="690" r="14"/><circle cx="960" cy="740" r="12"/>
        <circle cx="120" cy="820" r="14"/><circle cx="600" cy="800" r="12"/>
      </g>
      <!-- しぶき(ネイビー、リップの上) -->
      <g fill="#1F4E8C">
        <circle cx="560" cy="330" r="14"/><circle cx="640" cy="286" r="12"/><circle cx="730" cy="270" r="15"/>
        <circle cx="820" cy="292" r="11"/><circle cx="900" cy="330" r="13"/><circle cx="500" cy="380" r="9"/>
      </g>
      <!-- 手前の小波 -->
      <g fill="none" stroke="#F5EEDF" stroke-width="18" stroke-linecap="round">
        <path d="M 60 900 C 110 870, 160 870, 210 900 C 260 930, 310 930, 360 900"/>
        <path d="M 640 920 C 690 890, 740 890, 790 920 C 840 950, 890 950, 940 920"/>
      </g>
    </g>
    <!-- ヤシの木(左上向き) -->
    <g id="palm" fill="#1F4E8C">
      <path d="M232 720 C 224 610, 236 470, 292 372 L 332 380 C 284 480, 280 610, 292 720 Z"/>
      <path d="M318 364 C 240 296, 136 300, 76 352 C 150 340, 232 360, 296 396 Z"/>
      <path d="M318 364 C 292 268, 220 210, 136 208 C 210 236, 274 296, 300 380 Z"/>
      <path d="M318 364 C 330 258, 402 190, 494 184 C 420 218, 366 292, 342 380 Z"/>
      <path d="M318 364 C 402 290, 508 282, 580 326 C 506 322, 424 350, 350 396 Z"/>
      <path d="M318 364 C 244 376, 184 434, 160 516 C 214 464, 270 434, 332 410 Z"/>
      <path d="M318 364 C 398 380, 462 438, 484 522 C 432 470, 380 442, 316 416 Z"/>
      <circle cx="312" cy="386" r="16"/><circle cx="338" cy="398" r="13"/>
    </g>
    <g id="sun">
      <circle cx="0" cy="0" r="70" fill="#1F4E8C"/>
      <g stroke="#1F4E8C" stroke-width="20" stroke-linecap="round">
        <line x1="0" y1="-108" x2="0" y2="-136"/><line x1="0" y1="108" x2="0" y2="136"/>
        <line x1="-108" y1="0" x2="-136" y2="0"/><line x1="108" y1="0" x2="136" y2="0"/>
        <line x1="-76" y1="-76" x2="-96" y2="-96"/><line x1="76" y1="76" x2="96" y2="96"/>
        <line x1="76" y1="-76" x2="96" y2="-96"/><line x1="-76" y1="76" x2="-96" y2="96"/>
      </g>
    </g>
  </defs>
  <rect width="1024" height="1024" fill="#F5EEDF"/>
  <use href="#sun" transform="translate(830 200)"/>
  <use href="#palm"/>
  <use href="#wave"/>
</svg>